apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragops-data
  namespace: ragops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:

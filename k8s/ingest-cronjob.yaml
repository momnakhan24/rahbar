apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
  namespace: ragops
spec:
  schedule: 0 3 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingest
        spec:
          automountServiceAccountToken: false
          containers:
          - name: ingest
            image: rahbar-ragops:dev
            imagePullPolicy: Never
            envFrom:
            - configMapRef:
                name: ragops-config
            env:
            - name: CHROMA_COLLECTION
              value: rahbar_v1_nomic
            - name: RAGOPS_READ_ONLY
              value: 'false'
            command:
            - python
            - -m
            - ragops
            - --data
            - /data
            - ingest
            args:
            - --inbox
            - /data/inbox
            - --out
            - /data/results
            - --snapshot
            volumeMounts:
            - name: data
              mountPath: /data
            resources:
              requests:
                cpu: 1500m
                memory: 1280Mi
              limits:
                cpu: '2'
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: ragops-data
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          restartPolicy: Never

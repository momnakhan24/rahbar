# Temporary helper only. Do not include this resource in kustomization.yaml.
# Apply it after the corpus-data PVC is Bound, copy files with kubectl cp, then delete it.
apiVersion: v1
kind: Pod
metadata:
  name: corpus-loader
  namespace: rahbar
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 36000"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: corpus
          mountPath: /corpus
  volumes:
    - name: corpus
      persistentVolumeClaim:
        claimName: corpus-data

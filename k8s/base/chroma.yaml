apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          imagePullPolicy: IfNotPresent
          args: ["run", "--path", "/data", "--host", "0.0.0.0"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: SQLITE_TMPDIR
              value: /tmp
            - name: TMPDIR
              value: /tmp
          startupProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox-loader
  namespace: ragops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inbox-loader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbox-loader
    spec:
      automountServiceAccountToken: false
      containers:
      - name: loader
        image: rahbar-ragops:dev
        imagePullPolicy: Never
        command:
        - sleep
        - infinity
        env:
        - name: RAGOPS_READ_ONLY
          value: 'true'
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ragops-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

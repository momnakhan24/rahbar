apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-config
  namespace: ragops
data:
  EMBED_MODEL: nomic-embed-text
  EMBEDDING_VERSION: 0a109f422b47
  LLM_MODEL: qwen2.5:3b
  TEMPERATURE: '0'
  RELEVANCE_FLOOR: '0.60'
  TOP_K: '5'
  CHROMA_HOST: chroma
  CHROMA_PORT: '8000'
  OLLAMA_URL: http://ollama:11434
  TRACE_PATH: /data/traces/traces.jsonl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-config
  namespace: ragops
data:
  gate.yaml: '# Limit the allowable regression to the assignment''s two percentage
    points.

    recall_at_5_max_drop: 0.02

    # Lower bound is measured baseline faithfulness minus five percentage points.

    faithfulness_max_drop: 0.05

    # Allow up to 50% headroom over the measured baseline p95 on a shared CPU.

    p95_latency_baseline_factor: 1.5

    # Abstention correctness must meet or exceed the measured baseline directly.

    coverage_minimum: 0.85

    '

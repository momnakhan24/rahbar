apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: ragops
spec:
  selector:
    app.kubernetes.io/name: chroma
  ports:
  - port: 8000
    targetPort: 8000
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: ragops
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
    spec:
      automountServiceAccountToken: false
      containers:
      - name: chroma
        image: docker.io/chromadb/chroma:1.0.12
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 200m
            memory: 1024Mi
          limits:
            cpu: '1'
            memory: 2Gi
        volumeMounts:
        - name: chroma-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
      volumes: []
  volumeClaimTemplates:
  - metadata:
      name: chroma-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi

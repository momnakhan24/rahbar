apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
images:
  - name: rahbar-api
    newTag: 8df07b25a977007ffc74243a6086898fcc1e3ba8
  - name: rahbar-indexer
    newTag: 8df07b25a977007ffc74243a6086898fcc1e3ba8
  - name: rahbar-ui
    newTag: 8df07b25a977007ffc74243a6086898fcc1e3ba8
patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
        namespace: rahbar
      data:
        RETRIEVER: chroma
        LLM_PROVIDER: ollama-host
        LLM_MODEL: qwen2.5:3b
        RELEVANCE_FLOOR: "0.70"
        EMBED_MODEL: nomic-embed-text
        OLLAMA_URL: http://192.168.49.11:11434
  - target:
      kind: NetworkPolicy
      name: api-policy
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.49.11/32
  - target:
      kind: NetworkPolicy
      name: indexer-egress
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.49.11/32






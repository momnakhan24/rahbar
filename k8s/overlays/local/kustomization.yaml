apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
images:
  - name: rahbar-api
    newTag: 68306dd3b19217a367f80b08f687eb14f6343377
  - name: rahbar-indexer
    newTag: 7b4daae5a28f50df37d3a1c6fa5734a70f6f3bc0
  - name: rahbar-ui
    newTag: 7b4daae5a28f50df37d3a1c6fa5734a70f6f3bc0
patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
        namespace: rahbar
      data:
        RETRIEVER: chroma
        LLM_PROVIDER: ollama-host
        LLM_MODEL: llama3.2:1b
        EMBED_MODEL: nomic-embed-text
        OLLAMA_URL: http://192.168.49.11:11434
  - target:
      kind: NetworkPolicy
      name: api-policy
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.49.11/32
  - target:
      kind: NetworkPolicy
      name: indexer-egress
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.49.11/32



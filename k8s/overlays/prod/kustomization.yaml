apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
        namespace: rahbar
      data:
        RETRIEVER: chroma
        LLM_PROVIDER: ollama-host
        LLM_MODEL: qwen2.5:3b
        RELEVANCE_FLOOR: "0.70"
        EMBED_MODEL: nomic-embed-text
images:
  - name: rahbar-api
    newName: aimwnoaim/rahbar-api
    newTag: 8df07b25a977007ffc74243a6086898fcc1e3ba8
  - name: rahbar-indexer
    newName: aimwnoaim/rahbar-indexer
    newTag: 8df07b25a977007ffc74243a6086898fcc1e3ba8
  - name: rahbar-ui
    newName: aimwnoaim/rahbar-ui
    newTag: 8df07b25a977007ffc74243a6086898fcc1e3ba8



